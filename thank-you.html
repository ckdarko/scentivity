<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Scentivity</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="section" style="min-height: 70vh; display: grid; place-items: center; text-align: center;">
    <div>
      <p class="eyebrow">Message received</p>
      <h1 style="font-size: clamp(3rem, 7vw, 6rem);">Thank you.</h1>
      <p class="hero-text" style="margin-left: auto; margin-right: auto;">Your request has been prepared for Scentivity. You can also contact us by email at scentivitygh@gmail.com or WhatsApp at 053 458 4470.</p>
      <div class="hero-actions" style="justify-content: center;">
        <a class="btn primary" href="/">Return home</a>
        <a class="btn ghost" href="mailto:scentivitygh@gmail.com?subject=Scentivity%20Product%20Request&body=Hello%20Scentivity%2C%0A%0AI%20would%20like%20to%20send%20a%20product%20request.">Email Scentivity</a>
      </div>
    </div>
  <p id="paymentReference" class="hero-text"></p>
  </main>
<script>const ref = new URLSearchParams(location.search).get("reference"); const el = document.getElementById("paymentReference"); if (el && ref) el.textContent = "Payment reference: " + ref + ". Scentivity will confirm your order shortly.";</script>
</body>
</html>
