backend:
  name: git-gateway
  branch: main

media_folder: "assets/products/uploads"
public_folder: "assets/products/uploads"

publish_mode: simple

collections:
  - name: "store"
    label: "Scentivity Store"
    files:
      - name: "products"
        label: "Products"
        file: "data/products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — {{fields.mainCategory}} / {{fields.subCategory}} — {{fields.price}}"
            collapsed: false
            fields:
              - { label: "Product Name", name: "name", widget: "string" }
              - { label: "Brand", name: "brand", widget: "string", required: false, hint: "Example: Scentivity, Victoria's Secret, Bath & Body Works" }
              - label: "Main Category"
                name: "mainCategory"
                widget: "select"
                options:
                  - "Victoria's Secret Collection"
                  - "Bath & Body Works Collection"
                  - "Designer and Luxury Fragrances"
              - label: "Fragrance / Care Type"
                name: "subCategory"
                widget: "select"
                options:
                  - "Body Care"
                  - "Body Lotions and Cream"
                  - "Fine Fragrance Mist"
                  - "Body Washes & Shower Gels"
                  - "Hand Sanitizers"
                  - "Men's Body Care"
                  - "Home Fragrances"
                  - "Scented Candles"
                  - "Room Sprays"
                  - "Car Fragrances"
                  - "Wallflower Refills & Plugs"
              - { label: "Price", name: "price", widget: "string", hint: "Example: GH₵250" }
              - { label: "Size", name: "size", widget: "string", required: false, hint: "Example: 50 mL, 236 mL, 8 oz, 3-wick candle, Gift set" }
              - { label: "Product Photo", name: "image", widget: "image", required: false }
              - { label: "Optional Direct Payment Link / Checkout URL", name: "paymentLink", widget: "string", required: false, hint: "Optional: paste a Paystack, Flutterwave, Stripe, or other hosted checkout link for this individual product. The cart checkout can also use Paystack through the Netlify Function setup." }
              - { label: "Scent Notes / Description", name: "notes", widget: "text", required: false }
              - { label: "Available", name: "available", widget: "boolean", default: true, hint: "Turn this off to show the product as Coming Soon in the homepage slideshow and unavailable in the shop." }


          - label: "Combo Deals"
            name: "combos"
            widget: "list"
            summary: "{{fields.name}} — {{fields.comboPrice}}"
            collapsed: false
            hint: "Create discounted combo/bundle offers customers can add to cart."
            fields:
              - { label: "Combo Name", name: "name", widget: "string", hint: "Example: Sweet Starter Combo" }
              - { label: "Description", name: "description", widget: "text", required: false, hint: "Short buyer-facing description of the combo." }
              - { label: "Included Items", name: "includedItems", widget: "text", required: false, hint: "Example: Fragrance mist + body lotion + hand sanitizer" }
              - { label: "Original Price", name: "originalPrice", widget: "string", required: false, hint: "Example: GH₵470" }
              - { label: "Combo Discount Price", name: "comboPrice", widget: "string", hint: "Example: GH₵430" }
              - { label: "Discount Text", name: "discountText", widget: "string", required: false, hint: "Example: Save GH₵40 or 10% off" }
              - { label: "Combo Photo", name: "image", widget: "image", required: false, hint: "Upload a photo of the combo or one main product photo." }
              - { label: "Available", name: "available", widget: "boolean", default: true, required: false }
              - { label: "Feature as Deal of the Week", name: "dealOfWeek", widget: "boolean", default: false, required: false, hint: "Turn this on for the combo you want displayed in the homepage Deal of the Week card." }
