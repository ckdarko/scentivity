[build]
  publish = "."

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[functions]
  directory = "netlify/functions"
  included_files = ["data/products.json"]


# SCENTIVITY_LIGHTWEIGHT_MOBILE_PERFORMANCE_20260615
# Cache static files while allowing product data to revalidate after deploy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/data/products.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
